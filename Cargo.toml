[package]
name = "rustterm"
version = "0.1.0"
edition = "2024"
description = "A serial port terminal for Windows"
repository = "https://github.com/Paseditor/rust-term"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
serialport = { version = "4.8", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tempfile = "3"
rand = "0.9"
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Devices_Communication", "Win32_Foundation"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
winresource = { version = "0.1.34", default-features = false }
